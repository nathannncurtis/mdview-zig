  <g><rect class="d" x="4" y="32" width="26" height="22" style="stroke:#1b5e20;stroke-width:3"/></g>
  <g><ellipse class="e" cx="50" cy="43" rx="13" ry="11"/><rect x="70" y="32" width="26" height="22" fill="#6d4c41" style="fill:#8d6e63;stroke:currentColor"/></g>
