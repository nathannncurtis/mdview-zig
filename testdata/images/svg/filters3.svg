<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <filter id="disp" x="0" y="0" width="1" height="1"><feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="sharp"><feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0"/></filter>
  <filter id="emboss"><feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" preserveAlpha="true" edgeMode="none"/></filter>
  <g filter="url(#disp)"><rect x="6" y="6" width="44" height="44" fill="#2e7d32"/><circle cx="28" cy="28" r="14" fill="#fff"/></g>
  <g filter="url(#sharp)"><circle cx="70" cy="22" r="14" fill="#c62828" stroke="#fff" stroke-width="3"/></g>
  <rect x="90" y="8" width="24" height="40" rx="6" fill="#1565c0" filter="url(#emboss)"/>
</svg>
