<svg xmlns="http://www.w3.org/2000/svg" width="140" height="80" viewBox="0 0 140 80">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/><feOffset dx="3" dy="4" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.5"/><feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gray"><feColorMatrix type="saturate" values="0.2"/></filter>
  </defs>
  <rect x="8" y="8" width="36" height="36" fill="#e53935" filter="url(#blur)"/>
  <rect x="58" y="10" width="32" height="30" rx="4" fill="#3949ab" filter="url(#shadow)"/>
  <circle cx="116" cy="26" r="16" fill="#00acc1" filter="url(#gray)"/>
  <rect x="8" y="56" width="124" height="14" fill="#7cb342" filter="url(#shadow)"/>
</svg>
