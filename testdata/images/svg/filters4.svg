<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <defs>
    <filter id="tile" x="0" y="0" width="1" height="1"><feImage x="0" y="0" width="10" height="10" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Crect width='5' height='5' fill='%23e53935'/%3E%3Crect x='5' y='5' width='5' height='5' fill='%2300897b'/%3E%3C/svg%3E"/><feTile/></filter>
