<svg width="200" height="90" viewBox="0 0 200 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">Stats card</title>
  <style>
    .header { font: 600 14px 'mdview Sans'; fill: #2f80ed; animation: fadeInAnimation 0.8s ease-in-out forwards; }
    @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
    .stat { font: 600 11px 'mdview Sans'; fill: #434d58; }
    .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
    .icon { fill: #4c71f2; display: block; }
    .bold { font-weight: 700 }
    @keyframes fadeInAnimation { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="199" fill="#fffefe" stroke-opacity="1"/>
  <g data-testid="card-title" transform="translate(15, 22)"><text x="0" y="0" class="header" data-testid="header">Octo's GitHub Stats</text></g>
  <g data-testid="main-card-body" transform="translate(0, 36)">
    <g transform="translate(0, 0)"><g class="stagger" style="animation-delay: 450ms" transform="translate(15, 0)">
      <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="12" height="12"><path fill-rule="evenodd" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
      <text class="stat bold" x="20" y="10">Total Stars:</text><text class="stat bold" x="140" y="10" data-testid="stars">1,234</text></g></g>
    <g transform="translate(0, 18)"><g class="stagger" style="animation-delay: 600ms" transform="translate(15, 0)">
      <text class="stat" x="20" y="10">Commits (2026):</text><text class="stat bold" x="140" y="10">567</text></g></g>
    <g transform="translate(0, 36)"><g class="stagger" style="animation-delay: 750ms" transform="translate(15, 0)">
      <text class="stat" x="20" y="10">Pull Requests:</text><text class="stat bold" x="140" y="10">89</text></g></g>
  </g>
</svg>
