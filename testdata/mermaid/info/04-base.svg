<svg id="diagram" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 400px;" role="graphics-document document" aria-roledescription="info"><style>#diagram{font-family:Arial;font-size:16px;fill:#eee;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:hsl(180, 100%, 55%);}#diagram .error-text{fill:rgb(229.5, 0, 0);stroke:rgb(229.5, 0, 0);}#diagram .edge-thickness-normal{stroke-width:1px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#0b0b0b;stroke:#0b0b0b;}#diagram .marker.cross{stroke:#0b0b0b;}#diagram svg{font-family:Arial;font-size:16px;}#diagram p{margin:0;}#diagram .node .neo-node{stroke:hsl(0, 60%, 60%);}#diagram [data-look="neo"].node rect,#diagram [data-look="neo"].cluster rect,#diagram [data-look="neo"].node polygon{stroke:url(#diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram [data-look="neo"].node path{stroke:url(#diagram-gradient);stroke-width:1px;}#diagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node .neo-line path{stroke:hsl(0, 60%, 60%);filter:none;}#diagram [data-look="neo"].node circle{stroke:url(#diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node circle .state-start{fill:#000000;}#diagram [data-look="neo"].icon-shape .icon{fill:url(#diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><text x="100" y="40" class="version" font-size="32" style="text-anchor: middle;">v12.2.0</text></g></svg>