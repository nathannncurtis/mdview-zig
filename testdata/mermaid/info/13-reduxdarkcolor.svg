<svg id="diagram" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 400px;" role="graphics-document document" aria-roledescription="info"><style>#diagram{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:hsl(20, 1.5873015873%, 12.3529411765%);}#diagram .error-text{fill:rgb(222.9999999999, 223.6666666666, 223.9999999999);stroke:rgb(222.9999999999, 223.6666666666, 223.9999999999);}#diagram .edge-thickness-normal{stroke-width:2px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#cccccc;stroke:#cccccc;}#diagram .marker.cross{stroke:#cccccc;}#diagram svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;}#diagram p{margin:0;}#diagram .node .neo-node{stroke:#FFFFFF;}#diagram [data-look="neo"].node rect,#diagram [data-look="neo"].cluster rect,#diagram [data-look="neo"].node polygon{stroke:#FFFFFF;filter:url(#diagram-drop-shadow);}#diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram [data-look="neo"].node path{stroke:#FFFFFF;stroke-width:2px;}#diagram [data-look="neo"].node .outer-path{filter:url(#diagram-drop-shadow);}#diagram [data-look="neo"].node .neo-line path{stroke:#FFFFFF;filter:none;}#diagram [data-look="neo"].node circle{stroke:#FFFFFF;filter:url(#diagram-drop-shadow);}#diagram [data-look="neo"].node circle .state-start{fill:#000000;}#diagram [data-look="neo"].icon-shape .icon{fill:#FFFFFF;filter:url(#diagram-drop-shadow);}#diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#FFFFFF;filter:url(#diagram-drop-shadow);}#diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><text x="100" y="40" class="version" font-size="32" style="text-anchor: middle;">v12.2.0</text></g></svg>