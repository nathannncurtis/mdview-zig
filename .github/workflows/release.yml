name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mdview-*
          merge-multiple: true
          path: dist
      - name: Every asset is present
        run: |
          for f in mdview.exe mdview-setup.exe mdview mdview-linux-x86_64.deb mdview-macos-arm64.dmg; do
            test -s "dist/$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
