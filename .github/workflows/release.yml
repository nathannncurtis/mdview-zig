name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      sign: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release notes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md" || true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mdview-*
          merge-multiple: true
          path: dist
      - name: Every asset is present
        run: |
          for f in mdview.exe mdview-setup.exe mdview-x64.msix mdview mdview-linux-x86_64.deb mdview-macos-arm64.dmg; do
            test -s "dist/$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false
