name: build

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.0.0
      sign:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: 0.0.0
      sign:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall -Dcpu=baseline
      - name: Sign mdview.exe
        if: inputs.sign
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: nathancurtis-signing
          certificate-profile-name: nathancurtis-signing
          files: ${{ github.workspace }}\zig-out\bin\mdview.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Signing client
        if: inputs.sign
        run: |
          $pkg = "$env:RUNNER_TEMP\asc.zip"
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne '74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B') { throw 'signing client hash mismatch' }
          Expand-Archive $pkg "$env:RUNNER_TEMP\asc"
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1).FullName
          $meta = "$env:RUNNER_TEMP\metadata.json"
          '{"Endpoint":"https://wus2.codesigning.azure.net/","CodeSigningAccountName":"nathancurtis-signing","CertificateProfileName":"nathancurtis-signing"}' | Set-Content $meta
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGN_ARGS=sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $env:RUNNER_TEMP\asc\bin\x64\Azure.CodeSigning.Dlib.dll /dmdf $meta" >> $env:GITHUB_ENV
      - name: Installer
        env:
          VERSION: ${{ inputs.version }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $opts = @("/DMDVIEW_VERSION=$($env:VERSION.TrimStart('v'))")
          if ('${{ inputs.sign }}' -eq 'true') { $opts += '/DSIGN=1', "/Sazsign=`$q$env:SIGNTOOL`$q $env:SIGN_ARGS `$f" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $opts installer.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
      - name: MSIX
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zig build msix-assets
          if ($LASTEXITCODE) { throw 'msix assets failed' }
          zig build pack-msix -- zig-out/bin/mdview.exe $env:VERSION "$PWD\Output\mdview-x64.msix" "$env:RUNNER_TEMP\msix"
          if ($LASTEXITCODE) { throw 'msix failed' }
      - name: Sign mdview-x64.msix
        if: inputs.sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          & $env:SIGNTOOL $env:SIGN_ARGS.Split(' ') "$PWD\Output\mdview-x64.msix"
          if ($LASTEXITCODE) { throw 'signtool failed' }
      - name: Signatures are valid
        if: inputs.sign
        run: |
          $dir = "$env:RUNNER_TEMP\installed"
          Start-Process Output/mdview-setup.exe "/VERYSILENT /CURRENTUSER /DIR=`"$dir`" /MERGETASKS=`"!associate`"" -Wait
          foreach ($f in 'zig-out/bin/mdview.exe', 'Output/mdview-setup.exe', 'Output/mdview-x64.msix', "$dir\unins000.exe") {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f signature: $($sig.Status)" }
            "$f signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Install the package
        if: inputs.sign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Add-AppxPackage Output/mdview-x64.msix
          $p = Get-AppxPackage NathanCurtis.mdview
          if (-not $p) { throw 'package not installed' }
          "$($p.Name) $($p.Version) $($p.Publisher)"
          if ($p.Version -ne "$($env:VERSION.TrimStart('v')).0") { throw "version: $($p.Version)" }
          if ($p.Publisher -ne 'CN=Nathan Curtis, O=Nathan Curtis, L=Riverside, S=ca, C=US') { throw "publisher: $($p.Publisher)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\mdview.exe")) { throw 'alias missing' }
          Remove-AppxPackage $p
      - name: Stage
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item zig-out/bin/mdview.exe, Output/mdview-setup.exe, Output/mdview-x64.msix dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdview-windows
          path: dist/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libcairo2-dev libpango1.0-dev
      - run: bash .github/scripts/setup-zig.sh
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall -Dcpu=baseline
      - name: Debian package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications
          install -m 755 zig-out/bin/mdview deb/usr/bin/mdview
          cat > deb/DEBIAN/control << EOT
          Package: mdview
          Version: ${VERSION}
          Section: text
          Priority: optional
          Architecture: amd64
          Depends: libx11-6, libcairo2, libpango-1.0-0, libpangocairo-1.0-0
          Maintainer: nathannncurtis
          Description: Fast, native markdown viewer
           Dark-themed, borderless markdown viewer built with Zig and DirectWrite/Cairo/Pango.
          EOT
          cat > deb/usr/share/applications/mdview.desktop << EOT
          [Desktop Entry]
          Name=mdview
          Comment=Markdown Viewer
          Exec=mdview %f
          Terminal=false
          Type=Application
          MimeType=text/markdown;text/x-markdown;
          Categories=Utility;TextEditor;
          EOT
          dpkg-deb --build deb mdview-linux-x86_64.deb
      - name: Stage
        run: |
          mkdir dist
          cp zig-out/bin/mdview mdview-linux-x86_64.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdview-linux
          path: dist/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall -Dcpu=baseline
      - name: App bundle and disk image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p mdview.app/Contents/MacOS mdview.app/Contents/Resources
          install -m 755 zig-out/bin/mdview mdview.app/Contents/MacOS/mdview
          cat > mdview.app/Contents/Info.plist << EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>mdview</string>
            <key>CFBundleDisplayName</key><string>mdview</string>
            <key>CFBundleIdentifier</key><string>com.nathannncurtis.mdview</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>mdview</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeExtensions</key>
                <array><string>md</string><string>markdown</string></array>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>CFBundleTypeName</key><string>Markdown File</string>
              </dict>
            </array>
          </dict>
          </plist>
          EOT
          mkdir -p dmg_staging
          cp -r mdview.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "mdview" -srcfolder dmg_staging -ov -format UDZO mdview-macos-arm64.dmg
      - name: Stage
        run: |
          mkdir dist
          cp mdview-macos-arm64.dmg dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdview-macos
          path: dist/
          if-no-files-found: error
