name: math-dump

on:
  pull_request:
    paths:
      - 'src/math/**'
      - 'src/font/**'
      - 'tools/gen/math_dump.zig'
      - '.github/workflows/math-dump.yml'

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Render with the embedded math font
        run: zig build math-dump -- embedded 0 "$RUNNER_TEMP/out-embedded"
      - name: Render with the system math font
        run: zig build math-dump -- - 0 "$RUNNER_TEMP/out-system" --constants
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: math-dump-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/out-embedded
            ${{ runner.temp }}/out-system
