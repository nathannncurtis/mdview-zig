name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.f.outputs.app }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            app:
              - 'src/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'tools/**'
              - 'icon.ico'
              - 'icon.rc'
              - 'installer.iss'
              - 'msix/**'
              - '.github/scripts/setup-zig.sh'
              - '.github/workflows/build.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE="$HEAD~1"; fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
      - name: Names and workflow rules
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/rules.sh "${{ steps.range.outputs.range }}"
      - name: Secrets
        run: |
          v=8.30.1
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks git --redact --no-banner --log-opts="${{ steps.range.outputs.range }}" .

  # The same build and packaging the release runs, so a broken release shows up on the pull request.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/build.yml

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZLint
        run: |
          v=0.10.0
          curl -sSfL -o zlint "https://github.com/DonIsaac/zlint/releases/download/v$v/zlint-linux-x86_64"
          echo "0b331646d5e40bec3cfcb0694c5da0b13b9de8b10af12937a777ab3144b70b65  zlint" | sha256sum -c -
          chmod +x zlint
          git ls-files '*.zig' | ./zlint -S --deny-warnings

  fuzz:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Fuzz the parser
        run: |
          zig build fuzz --fuzz=800K -Doptimize=ReleaseSafe --summary all 2>&1 | tee fuzz.log
          ! grep -qE 'panic|run test failure|FAILED' fuzz.log

  # Parses the generator's adversarial files within a time and memory limit, on each OS (reduced sizes).
  stress-parser:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Generate the stress files
        run: zig build gen-stress -- "$RUNNER_TEMP/stress" small
      - name: Parse them
        run: zig build stress -Dstress-dir="$RUNNER_TEMP/stress" --summary all

  # Starts the ReleaseSmall app on every stress file, then resizes, scrolls and rewrites the open file.
  stress-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libcairo2-dev libpango1.0-dev xvfb xdotool
      - run: bash .github/scripts/setup-zig.sh
      - run: zig build -Doptimize=ReleaseSmall
      - name: Generate the stress files
        run: zig build gen-stress -- "$RUNNER_TEMP/stress" small
      - name: Run the app on them
        run: |
          exe=zig-out/bin/mdview
          [ "$RUNNER_OS" = Windows ] && exe=zig-out/bin/mdview.exe
          run="zig build stress-app -- $exe $RUNNER_TEMP/stress $RUNNER_TEMP/work --hold 10 --parallel 8 --interact paragraphs.md,table_rows.md"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a $run; else $run; fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  ci-ok:
    needs: [changes, rules, build, lint, fuzz, stress-parser, stress-app, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = false ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = false ]
