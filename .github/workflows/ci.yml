name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.f.outputs.app }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            app:
              - 'src/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'tools/**'
              - 'icon.ico'
              - 'icon.rc'
              - 'installer.iss'
              - 'msix/**'
              - '.github/scripts/**'
              - 'testdata/**'
              - '.github/workflows/build.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE="$HEAD~1"; fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
      - name: Names and workflow rules
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/rules.sh "${{ steps.range.outputs.range }}"
      - name: Secrets
        run: |
          tag=v8.30.1; v=${tag#v}
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks git --redact --no-banner --log-opts="${{ steps.range.outputs.range }}" .

  # The same build and packaging the release runs, so a broken release shows up on the pull request.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/build.yml
    with:
      light: ${{ github.event.pull_request.draft == true }}

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZLint
        run: |
          tag=v0.10.0; v=${tag#v}
          curl -sSfL -o zlint "https://github.com/DonIsaac/zlint/releases/download/v$v/zlint-linux-x86_64"
          echo "0b331646d5e40bec3cfcb0694c5da0b13b9de8b10af12937a777ab3144b70b65  zlint" | sha256sum -c -
          chmod +x zlint
          git ls-files '*.zig' | ./zlint -S --deny-warnings

  math-symbols:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Regenerate src/math/symbols.zig and compare
        run: |
          curl -sSfL -o "$RUNNER_TEMP/symbols.ts" https://raw.githubusercontent.com/KaTeX/KaTeX/9de4b3de47d33c685a99ce2eee9a643f28ed59bf/src/symbols.ts
          zig build gen-math-symbols -- "$RUNNER_TEMP/symbols.ts" "$RUNNER_TEMP/symbols.zig"
          diff "$RUNNER_TEMP/symbols.zig" src/math/symbols.zig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: math-symbols
          path: ${{ runner.temp }}/symbols.zig

  # Rebuilds the bundled font subsets from the pinned upstream fonts and fails if the committed copies differ.
  font-subsets:
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Regenerate
        run: |
          mkdir out
          curl -sSfL --retry 3 --retry-all-errors -o lib.tgz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  lib.tgz" | sha256sum -c -
          tar -xzf lib.tgz
          curl -sSfL --retry 3 --retry-all-errors -o stix.otf https://tug.ctan.org/fonts/stix2-otf/STIXTwoMath-Regular.otf
          echo "95bc2729e41faf93b0bcae9e96c4dc4da45855067fd0581e621e30734fe8d90b  stix.otf" | sha256sum -c -
          zig build subset-font -- liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf out/sans_regular.ttf "mdview Sans" Regular
          zig build subset-font -- liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf out/sans_bold.ttf "mdview Sans" Bold
          zig build subset-math-font -- stix.otf out/stix_math.z
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: font-subsets
          path: out
      - name: Committed copies match
        run: |
          for f in sans_regular.ttf sans_bold.ttf stix_math.z; do cmp out/$f src/font/$f; done

  # One leg per fuzz target, each with its own iteration budget. To add a target: write its
  # `test "fuzz <name>"` in src/fuzz.zig and add `<name>` and an iteration count here.
  # Size it so the slowest observed run, about 450 runs a second, stays under 10 minutes.
  fuzz:
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: markdown.parse
            iterations: 250K
          - target: html.Builder
            iterations: 150K
          - target: mermaid.render
            iterations: 300K
          - target: font.parse
            iterations: 2M
          - target: image.decode
            iterations: 400K
          - target: math.parse
            iterations: 400K
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Fuzz ${{ matrix.target }}
        run: |
          zig build fuzz -Dfuzz-filter="fuzz ${{ matrix.target }}" --fuzz=${{ matrix.iterations }} -Doptimize=ReleaseSafe --summary all 2>&1 | tee fuzz.log
          ! grep -qE 'panic|run test failure|FAILED' fuzz.log
          grep -qF 'Fuzz test: "fuzz.test.fuzz ${{ matrix.target }}"' fuzz.log

  # Parses the generator's adversarial files within a time and memory limit, on each OS (reduced sizes).
  stress-parser:
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/setup-zig.sh
      - name: Generate the stress files
        run: zig build gen-stress -- "$RUNNER_TEMP/stress" small
      - name: Parse them
        run: zig build stress -Dstress-dir="$RUNNER_TEMP/stress" --summary all

  # Starts the ReleaseSmall app on every stress file, then resizes, scrolls and rewrites the open file.
  stress-app:
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libcairo2-dev libpango1.0-dev xvfb xdotool
      - run: bash .github/scripts/setup-zig.sh
      - run: zig build -Doptimize=ReleaseSmall -Dcpu=baseline
      - name: Generate the stress files
        run: zig build gen-stress -- "$RUNNER_TEMP/stress" small
      - name: Run the app on them
        run: |
          exe=zig-out/bin/mdview
          [ "$RUNNER_OS" = Windows ] && exe=zig-out/bin/mdview.exe
          run="zig build stress-app -- $exe $RUNNER_TEMP/stress $RUNNER_TEMP/work --hold 10 --parallel 8 --interact paragraphs.md,table_rows.md"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a $run; else $run; fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  ci-ok:
    needs: [changes, rules, build, lint, math-symbols, font-subsets, fuzz, stress-parser, stress-app, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      DRAFT: ${{ github.event.pull_request.draft == true }}
    steps:
      - name: Every expected job passed and nothing else ran
        run: |
          python3 - <<'EOF'
          import json, os, sys
          n = json.loads(os.environ["NEEDS"])
          draft = os.environ["DRAFT"] == "true"
          out = n["changes"]["outputs"]
          app, docs = out.get("app") == "true", out.get("docs") == "true"
          want = {"changes": True, "rules": True, "build": app, "lint": app,
                  "font-subsets": app and not draft, "fuzz": app and not draft, "stress-parser": app and not draft,
                  "stress-app": app and not draft, "docs": docs and not draft}
          bad = [f"{k}: {n[k]['result']}" for k, run in want.items()
                 if n[k]["result"] != ("success" if run else "skipped")]
          print("\n".join(bad) or "ok")
          sys.exit(1 if bad else 0)
          EOF
